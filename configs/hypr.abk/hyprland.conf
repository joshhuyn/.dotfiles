# Hyprland Configuration
# https://wiki.hypr.land/Configuring/

# ==================
# MONITOR CONFIG
# ==================
monitor=,preferred,auto,auto

### OFFICE ###
monitor=DP-4, 1920x1080@60, 0x0, 1
monitor=DP-3, 1920x1080@60, 1920x0, 1
monitor=eDP-1, 1920x1080@60, 3840x0, 1

