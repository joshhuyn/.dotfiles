workspace=30,monitor:eDP-1


### HOME OFFICE ###
#monitor=eDP-1, off
# monitor=DP-3, 1920x1080@60, 4480x0, 1
# monitor=DP-4, 3840x2160@60, 0x0, 2
# monitor=DP-5, 2560x1440@60, 1920x0, 1

# ==================
# ENVIRONMENT VARS
# ==================
env = QT_QPA_PLATFORM,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = QT_QPA_PLATFORMTHEME,gtk3
env = QT_QPA_PLATFORMTHEME_QT6,gtk3
env = TERMINAL,alacritty

# ==================
# STARTUP APPS
# ==================
exec-once = bash -c "wl-paste --watch cliphist store &"
exec-once = /usr/lib/mate-polkit/polkit-mate-authentication-agent-1
# exec-once = qs -c noctalia-shell
exec-once = dms run
exec-once = vicinae server &

exec-once = kdeconnectd

exec-once = xdg-settings set default-web-browser vivaldi_vivaldi-stable.desktop 

# ==================
# INPUT CONFIG
# ==================
input {
    kb_model =
    kb_rules =

    repeat_rate = 50
    repeat_delay = 200

    follow_mouse = 1

    force_no_accel=true
    sensitivity = 0
    accel_profile = "flat"

    kb_layout = us,de
    kb_variant = ,
    kb_options = grp:alts_toggle

    touchpad {
        natural_scroll = false
    }
}

# ==================
# GENERAL LAYOUT
# ==================
general {
    gaps_in = 2.5
    gaps_out = 5
    border_size = 2

    col.active_border = rgba(BD93F9aa)
    col.inactive_border = rgba(595959aa)

    resize_on_border = false

    allow_tearing = false

    layout = dwindle
}

# ==================
# DECORATION
# ==================
decoration {
    rounding = 5

    active_opacity = 1.0
    inactive_opacity = 1.0
    blur {
        enabled = true
        size = 3
        passes = 1
        
        vibrancy = 0.1696
    }
}

# ==================
# ANIMATIONS
# ==================
animations {
    enabled = false

    animation = windowsIn, 1, 3, default
    animation = windowsOut, 1, 3, default
    animation = workspaces, 5, 5, default
    animation = windowsMove, 1, 4, default
    animation = fade, 1, 3, default
    animation = border, 1, 3, default
}

# ==================
# LAYOUTS
# ==================
dwindle {
    preserve_split = true
}

master {
    mfact = 0.5
}

# ==================
# MISC
# ==================
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 1
}

# ==================
# KEYBINDINGS
# ==================

$terminal = alacritty
$fileManager = dolphin
$menu = vicinae open

$mainMod = SUPER

### noctalia-shell ###

# bind = SUPER, space, exec, qs -c noctalia-shell ipc call launcher toggle
# bind = SUPER ALT, l, exec, qs -c noctalia-shell ipc call lockScreen lock

### dms ###
bind = SUPER ALT, l, exec, dms ipc call lock

bind = $mainMod, T, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, D, exec, $menu

bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, I, togglesplit, # dwindle

bind = $mainMod ALT, L, exec, dms ipc call lock lock

bind = $mainMod, F, fullscreen, 1
bind = $mainMod SHIFT, F, fullscreen, 0
bind = $mainMod ALT, F, togglefloating,

bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# scratchpad
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = ,XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bindel = ,XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

