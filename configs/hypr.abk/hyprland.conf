workspace=2,monitor:DP-3
workspace=3,monitor:DP-3
workspace=4,monitor:DP-3
workspace=5,monitor:DP-3
workspace=6,monitor:DP-3
workspace=7,monitor:DP-3
workspace=8,monitor:DP-3
workspace=9,monitor:DP-3
workspace=10,monitor:DP-3

workspace=11,monitor:DP-4
workspace=12,monitor:DP-4
workspace=13,monitor:DP-4
workspace=14,monitor:DP-4
workspace=15,monitor:DP-4
workspace=16,monitor:DP-4
workspace=17,monitor:DP-4
workspace=18,monitor:DP-4
workspace=19,monitor:DP-4
workspace=20,monitor:DP-4

workspace=21,monitor:eDP-1
workspace=22,monitor:eDP-1
workspace=23,monitor:eDP-1
workspace=24,monitor:eDP-1
workspace=25,monitor:eDP-1
workspace=26,monitor:eDP-1
workspace=27,monitor:eDP-1
